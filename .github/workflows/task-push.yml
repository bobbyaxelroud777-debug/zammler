name: Send Task Push Notifications

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check tasks and send OneSignal push
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node -e '
          const BIN_ID = "6ad86195ac6210605a44aedd";
          const MASTER_KEY = "$2a$10$nKqqdqhFVXrfDqCKY9cPTu.KRPk6gVu3c6X0yp0qtZYuapqTZlUSe";
          const APP_ID = process.env.ONESIGNAL_APP_ID;
          const REST_KEY = process.env.ONESIGNAL_REST_API_KEY;
          const isManual = process.env.EVENT_NAME === "workflow_dispatch";

          const TZ_OFFSET_MIN = 5 * 60;
          const nowUtc5 = new Date(Date.now() + TZ_OFFSET_MIN * 60 * 1000);
          const nowMinutes = nowUtc5.getUTCHours() * 60 + nowUtc5.getUTCMinutes();
          const currentHM = `${String(nowUtc5.getUTCHours()).padStart(2, "0")}:${String(nowUtc5.getUTCMinutes()).padStart(2, "0")}`;

          function parseHMToMinutes(hm) {
            if (!hm || typeof hm !== "string" || !hm.includes(":")) return null;
            const [h, m] = hm.split(":").map(Number);
            if (Number.isNaN(h) || Number.isNaN(m)) return null;
            return h * 60 + m;
          }

          const DEPT_LINKS = {
            PP7: "https://bobbyaxelroud777-debug.github.io/zammler/?key=pp7_4821",
            PP10: "https://bobbyaxelroud777-debug.github.io/zammler/?key=pp10_7319",
            PP11: "https://bobbyaxelroud777-debug.github.io/zammler/?key=pp11_2954",
            PP12: "https://bobbyaxelroud777-debug.github.io/zammler/?key=pp12_6183",
            PP13: "https://bobbyaxelroud777-debug.github.io/zammler/?key=pp13_8507",
            PP15: "https://bobbyaxelroud777-debug.github.io/zammler/?key=pp15_3746",
            PP16: "https://bobbyaxelroud777-debug.github.io/zammler/?key=pp16_9260",
            PP21: "https://bobbyaxelroud777-debug.github.io/zammler/?key=pp21_5418",
            PP24: "https://bobbyaxelroud777-debug.github.io/zammler/?key=pp24_1692",
            PP30: "https://bobbyaxelroud777-debug.github.io/zammler/?key=pp30_8035",
            PP32: "https://bobbyaxelroud777-debug.github.io/zammler/?key=pp32_4579"
          };

          (async () => {
            console.log("Current HM (UTC+5):", currentHM, "| Manual run:", isManual);
            console.log("APP_ID present:", Boolean(APP_ID), "| REST_KEY present:", Boolean(REST_KEY));

            if (!APP_ID || !REST_KEY) {
              console.error("Missing ONESIGNAL_APP_ID or ONESIGNAL_REST_API_KEY in GitHub Secrets");
              process.exit(1);
            }

            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
              headers: { "X-Master-Key": MASTER_KEY }
            });
            const json = await res.json();
            const tasks = (json.record && json.record.tasks) || [];
            console.log("Total tasks in JSONBin:", tasks.length);

            const activeTasks = tasks.filter(t => !t.completed && t.status !== "cancelled");
            const dueTasks = isManual
              ? activeTasks.slice(0, 1)
              : activeTasks.filter(t => {
                  const taskMin = parseHMToMinutes(t.time);
                  if (taskMin === null) return false;
                  const diff = nowMinutes - taskMin;
                  return diff >= 0 && diff <= 2;
                });

            console.log("Tasks to notify:", dueTasks.length);

            for (const task of dueTasks) {
              const depts = Array.isArray(task.dept) ? task.dept : [task.dept || "PP11"];
              const firstWh = depts
                .filter(Boolean)
                .map(d => (String(d).includes("_") ? String(d).split("_")[1] : String(d)))
                .find(w => DEPT_LINKS[w]);
              const targetUrl = (firstWh && DEPT_LINKS[firstWh]) || DEPT_LINKS.PP11;

              const filters = [];
              depts.filter(Boolean).forEach((d, idx) => {
                if (idx > 0) filters.push({ operator: "OR" });
                const strD = String(d);
                if (strD.startsWith("RO_") || strD.startsWith("SP_")) {
                  filters.push({ field: "tag", key: "dept", relation: "=", value: strD });
                } else {
                  filters.push({ field: "tag", key: "warehouse", relation: "=", value: strD });
                }
              });

              const payload = {
                app_id: APP_ID,
                filters: filters.length > 0 ? filters : [{ field: "tag", key: "warehouse", relation: "=", value: "PP11" }],
                headings: { en: `Zammler — ${firstWh || "PP11"}`, ru: `Zammler — ${firstWh || "PP11"}` },
                contents: {
                  en: task.title || task.text || task.name || "New task",
                  ru: task.title || task.text || task.name || "Новая задача"
                },
                url: targetUrl,
                priority: 10,
                ios_sound: "default"
              };

              const pushRes = await fetch("https://api.onesignal.com/notifications", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Key ${REST_KEY}`
                },
                body: JSON.stringify(payload)
              });

              const pushBody = await pushRes.text();
              console.log("OneSignal status:", pushRes.status, "| response:", pushBody);
            }
          })();
          '
