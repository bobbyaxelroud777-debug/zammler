<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAMMLER — Сеть 1</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00838f">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes pulse-red {
            0%, 100% { background-color: rgba(239, 68, 68, 0.95); box-shadow: inset 0 0 0 40px rgba(239, 68, 68, 0.6); }
            50% { background-color: rgba(185, 28, 28, 0.98); box-shadow: inset 0 0 0 80px rgba(239, 68, 68, 0.95); }
        }
        .alert-alarm-screen { animation: pulse-red 0.4s infinite ease-in-out; }
    </style>
</head>
<body id="app-body" class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- ПОЛНОЭКРАННЫЙ КРАСНЫЙ ПУШ-АЛЕРТ ТРЕВОГИ -->
    <div id="alarm-overlay" class="fixed inset-0 z-[100] flex flex-col items-center justify-center p-6 text-white hidden alert-alarm-screen text-center">
        <div class="bg-black/80 backdrop-blur-md p-8 rounded-3xl border-4 border-white/50 shadow-2xl max-w-xl w-full space-y-6">
            <div class="flex justify-center">
                <div class="bg-white text-red-600 p-4 rounded-full animate-bounce shadow-lg">
                    <i data-lucide="alert-octagon" class="w-16 h-16"></i>
                </div>
            </div>
            <h1 class="text-3xl font-extrabold tracking-wider uppercase">ВНИМАНИЕ! ВРЕМЯ ЗАДАЧИ!</h1>
            <p class="text-2xl font-bold text-red-100" id="alarm-task-title">Название задачи</p>
            <p class="text-sm text-red-200">Отделение: <span id="alarm-task-dept" class="font-bold underline"></span></p>
            <button onclick="dismissAlarm()" class="bg-white text-red-700 hover:bg-slate-100 font-extrabold px-8 py-4 rounded-2xl text-lg shadow-xl uppercase tracking-wider transition active:scale-95 cursor-pointer">
                ПОДТВЕРДИТЬ ВЫПОЛНЕНИЕ
            </button>
        </div>
    </div>

    <!-- ЗАСТАВКА -->
    <div id="splash-screen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="flex flex-col items-center space-y-3 animate-bounce">
            <div class="bg-[rgb(0,131,143)] p-5 rounded-3xl shadow-2xl text-white">
                <i data-lucide="map-pin" class="w-16 h-16"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-widest text-white">ZAMMLER</h1>
            <p class="text-sm font-medium text-teal-400 uppercase">Сеть 1</p>
        </div>
    </div>

    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-[rgb(0,131,143)] p-2 rounded-xl text-white">
                <i data-lucide="map-pin" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-white">ZAMMLER <span class="text-xs uppercase bg-teal-950 text-teal-300 border border-teal-800 rounded px-1.5 py-0.5 ml-1">Сеть 1</span></h1>
                <p class="text-xs text-slate-400" id="current-time-display">--:--</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <div class="bg-teal-950 border border-teal-800 text-teal-300 text-sm px-3 py-1.5 rounded-lg font-semibold flex items-center space-x-2">
                <i data-lucide="shield-check" class="w-4 h-4"></i>
                <span id="header-role-label">Загрузка...</span>
            </div>
        </div>
    </header>

    <nav class="bg-slate-800/50 border-b border-slate-700 px-4 flex space-x-2 overflow-x-auto">
        <button onclick="switchTab('tasks')" id="tab-btn-tasks" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-[rgb(0,164,180)] text-teal-400 flex items-center space-x-2">
            <i data-lucide="list-todo" class="w-4 h-4"></i><span>Задачи</span>
        </button>
        <button onclick="switchTab('audit')" id="tab-btn-audit" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-400 flex items-center space-x-2">
            <i data-lucide="award" class="w-4 h-4"></i><span>Аудит</span>
        </button>
        <button onclick="switchTab('productivity')" id="tab-btn-productivity" class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-400 flex items-center space-x-2">
            <i data-lucide="trending-up" class="w-4 h-4"></i><span>Продуктивность</span>
        </button>
    </nav>

    <main class="flex-1 p-4 max-w-7xl w-full mx-auto">
        <div id="tab-tasks" class="space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold" id="tasks-title">Задачи</h2>
                <div id="admin-controls" class="hidden">
                    <button onclick="openModal()" class="bg-[rgb(0,131,143)] hover:bg-[rgb(0,110,120)] text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center space-x-2 shadow-lg">
                        <i data-lucide="plus" class="w-4 h-4"></i><span>Создать задачу</span>
                    </button>
                </div>
            </div>
            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-xl">
                <div class="divide-y divide-slate-700" id="tasks-container"></div>
            </div>
        </div>

        <div id="tab-audit" class="space-y-4 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold">Таблица аудита по отделениям</h2>
                <div id="audit-hint" class="text-xs text-teal-400"></div>
            </div>
            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-x-auto shadow-xl">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-700/50 text-slate-300 border-b border-slate-700">
                            <th class="p-3">Отделение</th>
                            <th class="p-3">Неделя 1</th>
                            <th class="p-3">Неделя 2</th>
                            <th class="p-3">Неделя 3</th>
                            <th class="p-3">Неделя 4</th>
                            <th class="p-3 text-teal-400 font-bold bg-teal-950/40">Итог (Среднее)</th>
                        </tr>
                    </thead>
                    <tbody id="audit-table-body" class="divide-y divide-slate-700"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-productivity" class="space-y-4 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold">Таблица продуктивности по дням</h2>
            </div>
            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-x-auto shadow-xl p-4">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-700/50 text-slate-300 border-b border-slate-700">
                            <th class="p-3">Отделение</th>
                            <th class="p-3">Пн</th><th class="p-3">Вт</th><th class="p-3">Ср</th><th class="p-3">Чт</th><th class="p-3">Пт</th><th class="p-3">Сб</th><th class="p-3">Вс</th>
                        </tr>
                    </thead>
                    <tbody id="prod-table-body" class="divide-y divide-slate-700"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- МОДАЛКА -->
    <div id="task-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-lg shadow-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold">Новая задача для отделений</h3>
                <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="space-y-4">
                <input type="text" id="new-task-title" placeholder="Название задачи" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-sm text-white">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs text-slate-400">Отделения:</label>
                        <button type="button" onclick="toggleSelectAll()" class="text-xs text-teal-400 hover:underline">Все</button>
                    </div>
                    <div class="grid grid-cols-4 gap-2 bg-slate-900/50 p-3 rounded-xl border border-slate-700 max-h-40 overflow-y-auto" id="departments-checkboxes"></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="date" id="new-task-date" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-sm text-white">
                    <input type="time" id="new-task-time" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-sm text-white">
                </div>
                <div class="flex justify-end space-x-2">
                    <button onclick="closeModal()" class="px-4 py-2 rounded-lg bg-slate-700 text-slate-300 text-sm">Отмена</button>
                    <button onclick="submitTaskForm()" class="px-4 py-2 rounded-lg bg-[rgb(0,131,143)] text-white text-sm font-semibold">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const departments = ['ПП7', 'ПП10', 'ПП11', 'ПП12', 'ПП13', 'ПП15', 'ПП16', 'ПП21', 'ПП24', 'ПП30', 'ПП32'];

        function getRoleFromURL() {
            const params = new URLSearchParams(window.location.search);
            const dept = params.get('dept');
            if (dept) {
                const found = departments.find(d => d.toLowerCase() === dept.trim().toLowerCase());
                if (found) return found;
            }
            return 'admin';
        }

        const currentRole = getRoleFromURL();

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => document.getElementById('splash-screen')?.remove(), 500);
            document.getElementById('header-role-label').innerHTML = (currentRole === 'admin') ? '👑 Администратор' : `🏢 Отделение: ${currentRole}`;
            
            document.getElementById('departments-checkboxes').innerHTML = departments.map(d => `
                <label class="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer p-1">
                    <input type="checkbox" name="dept-checkbox" value="${d}" class="rounded bg-slate-700 border-slate-600 text-teal-600 w-4 h-4">
                    <span>${d}</span>
                </label>`).join('');
            
            document.getElementById('new-task-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('new-task-time').value = "15:00";
            
            renderApp();
        });

        // Синхронизация между вкладками браузера через localStorage
        window.addEventListener('storage', (event) => {
            if (event.key === 'zammler_solid_tasks') {
                tasks = JSON.parse(event.newValue) || [];
                renderApp();
            }
        });

        function toggleSelectAll() {
            const cbs = document.querySelectorAll('input[name="dept-checkbox"]');
            const allChecked = Array.from(cbs).every(cb => cb.checked);
            cbs.forEach(cb => cb.checked = !allChecked);
        }

        function switchTab(id) {
            document.querySelectorAll('main > div').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${id}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.className = "tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-400 flex items-center space-x-2");
            document.getElementById(`tab-btn-${id}`).className = "tab-btn px-4 py-3 text-sm font-medium border-b-2 border-[rgb(0,164,180)] text-teal-400 flex items-center space-x-2";
        }

        // Надежное хранение задач с дефолтными тестовыми данными для ПП7
        let tasks = JSON.parse(localStorage.getItem('zammler_solid_tasks')) || [
            { id: 1, date: '20.10.2026', time: '14:30', title: 'Тест 5', dept: 'ПП7', status: 'pending' },
            { id: 2, date: '20.10.2026', time: '16:30', title: 'Тест 6', dept: 'ПП7', status: 'pending' }
        ];

        let auditData = JSON.parse(localStorage.getItem('zammler_audit_v16')) || {
            'ПП7': [85, 90, 88, 92], 'ПП10': [80, 82, 85, 88], 'ПП11': [92, 94, 96, 95],
            'ПП12': [78, 80, 82, 85], 'ПП13': [88, 89, 90, 91], 'ПП15': [95, 96, 98, 97],
            'ПП16': [82, 85, 84, 86], 'ПП21': [90, 91, 92, 93], 'ПП24': [75, 78, 80, 82],
            'ПП30': [87, 88, 89, 90], 'ПП32': [91, 93, 92, 95]
        };
        let prodData = JSON.parse(localStorage.getItem('zammler_prod_v16')) || {
            'ПП7': [90, 92, 88, 94, 95, 90, 91], 'ПП10': [85, 88, 86, 90, 92, 85, 87],
            'ПП11': [95, 96, 94, 98, 99, 95, 96], 'ПП12': [80, 82, 81, 85, 86, 80, 82],
            'ПП13': [89, 90, 88, 92, 93, 89, 90], 'ПП15': [97, 98, 96, 99, 100, 97, 98],
            'ПП16': [84, 86, 85, 88, 90, 84, 85], 'ПП21': [91, 93, 92, 95, 96, 91, 92],
            'ПП24': [78, 80, 79, 83, 84, 78, 80], 'ПП30': [88, 90, 89, 92, 93, 88, 89],
            'ПП32': [93, 95, 94, 97, 98, 93, 94]
        };

        function saveAndSync() {
            localStorage.setItem('zammler_solid_tasks', JSON.stringify(tasks));
            renderApp();
        }

        let activeAlarmAudioCtx = null;
        function playNavalAlarmLoop() {
            try {
                if (!activeAlarmAudioCtx) activeAlarmAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (activeAlarmAudioCtx.state === 'suspended') activeAlarmAudioCtx.resume();
                const now = activeAlarmAudioCtx.currentTime;
                const osc = activeAlarmAudioCtx.createOscillator();
                const gain = activeAlarmAudioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(700, now);
                osc.frequency.linearRampToValueAtTime(1100, now + 0.5);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.connect(gain); gain.connect(activeAlarmAudioCtx.destination);
                osc.start(now); osc.stop(now + 0.6);
            } catch(e) {}
        }

        let alarmInterval = null;
        let activeAlarmTaskId = null;

        function triggerTimeAlarm(task) {
            if (currentRole !== 'admin' && task.dept.toLowerCase() === currentRole.toLowerCase()) {
                if (document.getElementById('alarm-overlay').classList.contains('hidden')) {
                    activeAlarmTaskId = task.id;
                    document.getElementById('alarm-task-title').textContent = task.title;
                    document.getElementById('alarm-task-dept').textContent = task.dept;
                    document.getElementById('alarm-overlay').classList.remove('hidden');
                    
                    playNavalAlarmLoop();
                    if (!alarmInterval) alarmInterval = setInterval(playNavalAlarmLoop, 800);
                }
            }
        }

        function dismissAlarm() {
            document.getElementById('alarm-overlay').classList.add('hidden');
            if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; }
            if (activeAlarmTaskId) {
                completeTask(activeAlarmTaskId);
                activeAlarmTaskId = null;
            }
        }

        setInterval(() => {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const dateStr = `${day}.${month}.${year}`;

            document.getElementById('current-time-display').textContent = `Текущее время: ${timeStr}`;

            tasks.forEach(t => {
                if (t.status === 'pending' && t.date === dateStr && t.time === timeStr) {
                    triggerTimeAlarm(t);
                }
            });
        }, 1000);

        function openModal() { document.getElementById('task-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('task-modal').classList.add('hidden'); }

        function submitTaskForm() {
            const title = document.getElementById('new-task-title').value.trim();
            const date = document.getElementById('new-task-date').value.split('-').reverse().join('.');
            const time = document.getElementById('new-task-time').value;
            const depts = Array.from(document.querySelectorAll('input[name="dept-checkbox"]:checked')).map(cb => cb.value);
            
            if (!title || !depts.length) { alert('Заполните название и выберите отделение'); return; }
            
            depts.forEach((d, i) => tasks.unshift({ id: Date.now()+i, title, dept: d, date, time, status: 'pending' }));
            closeModal();
            saveAndSync();
            alert('Задача успешно создана!');
        }

        function completeTask(id) {
            const t = tasks.find(x => x.id === id);
            if (t) { 
                t.status = 'done'; 
                saveAndSync();
            }
        }

        function updateAuditCell(dept, idx, val) {
            auditData[dept][idx] = parseInt(val) || 0;
            localStorage.setItem('zammler_audit_v16', JSON.stringify(auditData));
            renderAuditTable();
        }

        function updateProdCell(dept, idx, val) {
            prodData[dept][idx] = parseInt(val) || 0;
            localStorage.setItem('zammler_prod_v16', JSON.stringify(prodData));
            renderProdTable();
        }

        function renderApp() {
            const isAdmin = (currentRole === 'admin');
            document.getElementById('admin-controls').classList.toggle('hidden', !isAdmin);
            document.getElementById('tasks-title').textContent = isAdmin ? 'Все задачи (Администратор)' : `Задачи отделения: ${currentRole}`;
            
            const list = isAdmin ? tasks : tasks.filter(t => t.dept.toLowerCase() === currentRole.toLowerCase());
            const container = document.getElementById('tasks-container');
            
            container.innerHTML = list.length === 0 ? `<div class="p-6 text-center text-slate-400">Нет задач</div>` : list.map(t => `
                <div class="p-4 flex justify-between items-center hover:bg-slate-700/20">
                    <div>
                        <span class="text-xs bg-slate-700 px-2 py-0.5 rounded text-slate-300 font-mono">${t.date} ${t.time}</span>
                        <span class="bg-teal-950 text-teal-300 border border-teal-800 px-2 py-0.5 rounded font-bold ml-2 text-xs">${t.dept}</span>
                        <p class="text-sm font-medium text-slate-200 mt-1">${t.title}</p>
                    </div>
                    <div>
                        ${t.status === 'done' ? '<span class="text-teal-400 text-xs font-semibold">✓ Выполнено</span>' : 
                          (isAdmin ? `<span class="text-xs text-slate-400">\${t.dept}</span>` : `<button onclick="completeTask(\${t.id})" class="bg-[rgb(0,131,143)] text-white px-3 py-1.5 rounded text-xs font-bold cursor-pointer">Выполнить</button>`)}
                    </div>
                </div>`).join('');

            renderAuditTable();
            renderProdTable();
        }

        function renderAuditTable() {
            const isAdmin = (currentRole === 'admin');
            const depts = isAdmin ? departments : [currentRole];
            document.getElementById('audit-hint').textContent = isAdmin ? 'Все отделения' : `Редактирование: ${currentRole}`;
            document.getElementById('audit-table-body').innerHTML = depts.map(d => {
                const w = auditData[d] || [0,0,0,0];
                const avg = Math.round(w.reduce((a,b)=>a+b,0)/4);
                return `<tr class="hover:bg-slate-700/20"><td class="p-3 font-bold text-teal-300">${d}</td>` +
                    w.map((val, i) => `<td class="p-2"><input type="number" value="${val}" onchange="updateAuditCell('${d}', ${i}, this.value)" class="w-20 bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm text-white"></td>`).join('') +
                    `<td class="p-3 font-bold text-teal-400 bg-teal-950/30">${avg}%</td></tr>`;
            }).join('');
        }

        function renderProdTable() {
            const isAdmin = (currentRole === 'admin');
            const depts = isAdmin ? departments : [currentRole];
            document.getElementById('prod-table-body').innerHTML = depts.map(d => {
                const days = prodData[d] || [0,0,0,0,0,0,0];
                return `<tr class="hover:bg-slate-700/20"><td class="p-3 font-bold text-teal-300">${d}</td>` +
                    days.map((val, i) => `<td class="p-2"><input type="number" value="${val}" onchange="updateProdCell('${d}', ${i}, this.value)" class="w-16 bg-slate-700 border border-slate-600 rounded px-1.5 py-1 text-sm text-white"></td>`).join('') +
                    `</tr>`;
            }).join('');
        }
    </script>
</body>
</html>
